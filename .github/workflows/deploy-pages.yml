name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Se publica UNICAMENTE el dashboard ejecutivo. Nunca se sube el
      # repositorio completo: la base de datos institucional, los respaldos,
      # los reportes internos y la configuracion local NO deben quedar
      # accesibles publicamente en GitHub Pages.
      - name: Preparar contenido publicable
        run: |
          mkdir -p _publicacion
          cp index.html _publicacion/index.html
          echo "Contenido que se publicara:"
          ls -la _publicacion

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_publicacion'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
